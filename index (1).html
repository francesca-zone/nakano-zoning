<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nakano-ku Zoning Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
      background: #0f0f0f;
    }

    #map { height: 100vh; width: 100%; }

    #title-card {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 16px 20px;
      color: #fff;
    }

    #title-card h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }

    #title-card p {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 3px;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    #legend {
      position: absolute;
      bottom: 30px;
      left: 20px;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 14px 16px;
      color: #fff;
      min-width: 220px;
    }

    #legend h3 {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 7px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .legend-item:hover { opacity: 0.7; }
    .legend-item:last-child { margin-bottom: 0; }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .legend-label {
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: 300;
      line-height: 1.4;
    }

    .legend-sublabel {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      display: block;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(10,10,10,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      color: #fff;
      backdrop-filter: blur(12px);
    }

    .leaflet-popup-tip { background: rgba(10,10,10,0.95); }
    .leaflet-popup-close-button { color: rgba(255,255,255,0.4) !important; }

    .leaflet-popup-content {
      margin: 14px 16px;
      font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
    }

    .popup-zone-name {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .popup-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 10px;
    }

    .popup-stat { font-size: 11px; color: rgba(255,255,255,0.5); }

    .popup-stat span {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
    }

    .zone-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .popup-gallery {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-top: 8px;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .popup-gallery::-webkit-scrollbar { height: 3px; }
    .popup-gallery::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    .popup-gallery::-webkit-scrollbar-track { background: transparent; }

    .popup-gallery img {
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
      scroll-snap-align: start;
      border: 1px solid rgba(255,255,255,0.08);
      display: block;
    }

    .popup-gallery-hint {
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      margin-top: 5px;
      text-align: right;
    }

    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important;
      color: rgba(255,255,255,0.3) !important;
      font-size: 9px !important;
    }

    .leaflet-control-attribution a { color: rgba(255,255,255,0.4) !important; }

    .leaflet-control-zoom a {
      background: rgba(10,10,10,0.88) !important;
      border-color: rgba(255,255,255,0.1) !important;
      color: rgba(255,255,255,0.7) !important;
    }

    .leaflet-control-zoom a:hover {
      background: rgba(40,40,40,0.95) !important;
      color: #fff !important;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="title-card">
    <h1>中野区 · Nakano-ku</h1>
    <p>用途地域 · Land Use Zoning Map</p>
  </div>

  <div id="legend">
    <h3>用途地域</h3>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>

    const ZONE_CONFIG = {
      '商業地域':                 { color: '#e05c4a', label: 'Commercial',               sublabel: '商業地域' },
      '近隣商業地域':             { color: '#e8924a', label: 'Neighbourhood Commercial',  sublabel: '近隣商業地域' },
      '準工業地域':               { color: '#9e9e8e', label: 'Quasi-Industrial',          sublabel: '準工業地域' },
      '第一種住居地域':           { color: '#5b8dd9', label: 'Category 1 Residential',    sublabel: '第一種住居地域' },
      '第一種中高層住居専用地域': { color: '#8b6bb5', label: 'Mid-High Rise Excl. Res.', sublabel: '第一種中高層住居専用地域' },
      '第二種中高層住居専用地域': { color: '#5baaa0', label: 'Mid-High Rise Res. (2)',   sublabel: '第二種中高層住居専用地域' },
      '第一種低層住居専用地域':   { color: '#6aab72', label: 'Low-Rise Excl. Residential', sublabel: '第一種低層住居専用地域' },
    };

    // Photos per zone type — filenames relative to repo root
    const PHOTO_MAP = {
      '商業地域':                 ['Commercial.JPG', 'Commercial1.JPG', 'Commercial2.JPG'],
      '近隣商業地域':             ['NeighbourhoodCommercial.JPG', 'NeighbourhoodCommercial1.JPG'],
      '第一種低層住居専用地域':   ['Low-Rise.JPG', 'Low-Rise1.JPG', 'Low-Rise2.JPG', 'Low-Rise3.JPG', 'Low-Rise4.JPG'],
      '第一種中高層住居専用地域': ['Mid-to-High-Rise.JPG', 'Mid-to-High-Rise1.JPG', 'Mid-to-High-Rise2.JPG', 'Mid-to-High-Rise3.JPG'],
      '第一種住居地域':           ['Category1Residential.JPG', 'Category1Residential1.JPG', 'Category1Residential2.JPG'],
      '準工業地域':               ['industrial1.JPG', 'industrial2.JPG'],
    };

    const DEFAULT_COLOR = '#666655';

    const map = L.map('map', {
      center: [35.7073, 139.6630],
      zoom: 14,
      zoomControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Build legend
    const legend = document.getElementById('legend');
    Object.entries(ZONE_CONFIG).forEach(([key, cfg]) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `
        <div class="legend-swatch" style="background:${cfg.color}"></div>
        <div class="legend-label">
          ${cfg.label}
          <span class="legend-sublabel">${cfg.sublabel}</span>
        </div>
      `;
      legend.appendChild(item);
    });

    // Load GeoJSON
    fetch('nakano_zoning.geojson')
      .then(r => {
        if (!r.ok) throw new Error('GeoJSON not found');
        return r.json();
      })
      .then(data => {
        L.geoJSON(data, {
          style: feature => {
            const zone = feature.properties.A29_005;
            const cfg = ZONE_CONFIG[zone];
            return {
              fillColor: cfg ? cfg.color : DEFAULT_COLOR,
              fillOpacity: 0.55,
              color: cfg ? cfg.color : DEFAULT_COLOR,
              weight: 0.8,
              opacity: 0.9
            };
          },
          onEachFeature: (feature, layer) => {
            const p = feature.properties;
            const zone = p.A29_005 || 'Unknown';
            const cfg = ZONE_CONFIG[zone];
            const color = cfg ? cfg.color : DEFAULT_COLOR;
            const bld = p.A29_006 && p.A29_006 !== 9999 ? p.A29_006 + '%' : '—';
            const far = p.A29_007 && p.A29_007 !== 9999 ? p.A29_007 + '%' : '—';

            const photos = PHOTO_MAP[zone] || [];
            const galleryHtml = photos.length > 0
              ? `<div class="popup-gallery">
                  ${photos.map(f => `<img src="${f}" alt="${zone}" loading="lazy">`).join('')}
                </div>
                ${photos.length > 1 ? `<div class="popup-gallery-hint">← scroll for more · ${photos.length} photos</div>` : ''}`
              : '';

            layer.bindPopup(`
              <div class="popup-zone-name">
                <span class="zone-dot" style="background:${color}"></span>${zone}
              </div>
              <div class="popup-stats">
                <div class="popup-stat">建蔽率<span>${bld}</span></div>
                <div class="popup-stat">容積率<span>${far}</span></div>
              </div>
              ${galleryHtml}
            `, { maxWidth: 240 });

            layer.on('mouseover', function() {
              this.setStyle({ fillOpacity: 0.8, weight: 2 });
            });
            layer.on('mouseout', function() {
              this.setStyle({ fillOpacity: 0.55, weight: 0.8 });
            });
          }
        }).addTo(map);
      })
      .catch(err => {
        console.error('Could not load GeoJSON:', err);
      });

  </script>
</body>
</html>
